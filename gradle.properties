# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# 目标版本：Minecraft 1.20.1 + Fabric Loader + Fabric API（详见：https://fabricmc.net/develop）
minecraft_version=1.20.1
loader_version=0.15.11
loom_version=1.5-SNAPSHOT

# Mod Properties
mod_version=2.14.0
maven_group=com.example
archives_base_name=structure_race

# Dependencies
# Fabric API 1.20.1 对应的版本（0.92.x 系列是 1.20.1 的稳定版）
fabric_api_version=0.92.0+1.20.1
